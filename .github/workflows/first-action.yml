Workflows
jobs
Steps

First step is to setup workflow in GitHub action

under the workflow there can be multiple jobs

under the jobs there can be multiple steps
like download the code in first steps
install the dependency in second steps
run automated test in third steps

Trigger and Events
events will define when given workflow will be excuted
like it define when it will be trigger like manual or it will trigger if any commit push on a certain branch.

Jobs
Runner (execution environment)
contain one or more steps

Multiple run jobs in parallel default or sequential


Steps
execute a shell script or an action
can use custom or third party actions
steps are executed in order
can be conditionally 


