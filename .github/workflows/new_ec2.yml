name: Script automation

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'

permissions:
  id-token: write

jobs:
  Connect_EC2:
    name: Run Shell script for system Health check
    runs-on: ubuntu-latest
      
    steps:

      - name: CheckOut the repository
        uses: actions/checkout@v3

      - name: Install packages
        run: |
          sudo apt-get update

      - name: Login AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Create SSH key
        run: |
          echo "${{ secrets.EC2_HOST_KEY }}" | tr -d '\r' > key.pem
          chmod 400 key.pem

      - name: Check EC2 connection
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ec2-user@35.154.240.64 <<EOF
          pwd
          cd /home/ec2-user/infra_sanity
          echo "starting shell scripts"
          sh test.sh
          sleep 120
          formatted_result=\$(cat /home/ec2-user/infra_sanity/script_system.log)
          echo \$formatted_result
          ls -lrt
          EOF
